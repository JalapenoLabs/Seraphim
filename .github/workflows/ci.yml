name: CI

# Test every pull request and every push to the long-lived branches.
on:
  pull_request:
  push:
    branches: [main, develop]

# Don't pile up redundant runs for the same ref; a newer push supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The three jobs are independent, so a failure in one never short-circuits the
  # others ("no fail fast"). Within a job, checks use `if: ${{ !cancelled() }}`
  # so a formatting failure still lets the tests run and report.

  api:
    name: API (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api

    # Disposable Postgres for the migration check below. sqlx uses runtime
    # queries, so a broken or duplicate migration (a repeated version number, a
    # typo in an ALTER TABLE) compiles and tests green and only fails at API
    # boot on a real deploy. Applying the embedded migrations to a real database
    # here catches that in the PR. Only the container port is declared, so
    # Docker picks a free host port, read back via job.services below.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seraphim
          POSTGRES_PASSWORD: seraphim
          POSTGRES_DB: seraphim_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U seraphim -d seraphim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel (1.88) and its components. Install
      # them before the cache step, whose key includes the compiler version.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # Hosted runners start cold every run, so restore the cargo registry and
      # the compiled dependencies instead of rebuilding them from source.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --all-features

      # Apply the embedded migrations to the throwaway Postgres above. Runs the
      # same `sqlx::migrate!("./migrations")` set the API runs at boot, so a
      # broken migration fails here instead of on a real deploy.
      - name: Migrate (throwaway Postgres)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgres://seraphim:seraphim@localhost:${{ job.services.postgres.ports['5432'] }}/seraphim_test
        run: cargo run --bin migrate

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The frontend uses Yarn Berry (see frontend/package.json `packageManager`),
      # enabled through Corepack which ships with Node.
      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Type-check
        if: ${{ !cancelled() }}
        run: yarn check

      - name: Build
        if: ${{ !cancelled() }}
        run: yarn build

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The workspace image builds on devcontainers/universal, which unpacks to
      # well over 10 GB. A hosted runner guarantees only 14 GB, so remove the
      # preinstalled SDKs no job here uses (Android, .NET, Haskell, CodeQL).
      - name: Free disk space for the workspace image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # `docker compose build` reads the file's variable interpolation; provide
      # placeholders so it parses cleanly. (Build needs no real secrets.)
      - name: Provide placeholder env
        run: cp .env.example .env

      # The workspace image's base, mcr.microsoft.com/devcontainers/universal, is
      # pulled from Microsoft's registry, whose anonymous token endpoint
      # (mcrprod.azurecr.io/oauth2/token) intermittently returns 401 and flakes
      # otherwise-green PRs. Retry the build a few times with a short backoff;
      # cached layers make retries cheap and a genuine build error still fails.
      - name: Build images
        run: |
          for attempt in 1 2 3; do
            if docker compose build api frontend workspace; then
              exit 0
            fi
            echo "::warning::image build attempt ${attempt} failed (likely a transient MCR pull 401); retrying in 15s"
            sleep 15
          done
          echo "::error::image build failed after 3 attempts"
          exit 1
